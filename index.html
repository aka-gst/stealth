<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ПЕРИМЕТР</title>
<link rel="stylesheet" href="./styles/game.css">
</head>
<body>
<div id="stage">
    <canvas id="game"></canvas>
    <div id="pad" aria-hidden="true"></div>
    <div id="buttons" aria-hidden="true">
        <button id="b-creep" type="button">крас<br>ться</button>
        <button id="b-coin" type="button">моне<br>та</button>
        <button id="b-act" type="button">снять</button>
        <button id="b-kill" type="button">нож</button>
        <button id="b-fire" type="button">огонь</button>
    </div>
</div>
<p id="keys">
    <b>WASD</b> идти · <b>C</b> красться · <b>Shift</b> бежать · <b>мышь</b> смотреть ·
    <b>E</b> снять со спины / взять тело · <b>F</b> нож · <b>Q</b> или ПКМ монета ·
    <b>пробел</b> или ЛКМ выстрел · <b>R</b> заново
</p>
<script type="module" src="./src/main.js?v=1"></script>
</body>
</html>
