<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>МГС</title>
<!--
  Обезличенный счётчик — тот же Umami, что на главной и на остальных играх:
  без кук, без профилей. Ставится в момент создания страницы, иначе игра
  живёт, а знать, играет ли в неё кто-нибудь, нельзя.
-->
<script>
if (new URLSearchParams(location.search).get('кадр') !== '1') {
    const pulse = document.createElement('script');
    pulse.defer = true;
    pulse.src = '/pulse/script.js';
    pulse.dataset.websiteId = 'de024048-c4c3-4639-bbdf-808c558f6d71';
    document.head.append(pulse);
}
</script>
<link rel="stylesheet" href="./styles/game.css">
</head>
<body>
<div id="topbar">
    <!--
      Не ⌂ (U+2302): в системных шрифтах у него нет начертания, и кнопка
      выглядит пустым квадратом — то есть её будто и нет. Взято из ACID UNO,
      где на эти грабли уже наступили.
    -->
    <a id="homeLink" class="iconButton" href="../" aria-label="На главную" title="На главную">🏠</a>
</div>
<div id="stage">
    <canvas id="game"></canvas>
</div>
<!--
  Управление пальцем живёт ПОД кадром, а не поверх него. Кнопка, лежащая на
  игровом поле, закрывает собой ровно то, ради чего её нажимают: укрытие,
  стража, строку задачи. В стелсе это дороже, чем где-либо: половина игры —
  смотреть, куда смотрит чужой конус.
-->
<div id="controls" aria-hidden="true">
    <div id="pad"></div>
    <div id="buttons">
        <button id="b-creep" type="button">тихо</button>
        <button id="b-prone" type="button">лечь</button>
        <button id="b-act" type="button">снять</button>
        <button id="b-kill" type="button">нож</button>
        <button id="b-box" type="button">короб</button>
        <button id="b-coin" type="button">монета</button>
        <button id="b-fire" type="button">огонь</button>
    </div>
</div>
</div>
<p id="keys">
    <b>WASD</b> идти · <b>C</b> красться · <b>Z</b> лечь · <b>V</b> выглянуть из-за угла ·
    <b>Shift</b> бежать · <b>мышь</b> смотреть ·
    <b>E</b> снять со спины / взять тело / рубильник / стук в стену · <b>F</b> нож ·
    <b>B</b> коробка · <b>Q</b> или ПКМ монета · <b>пробел</b> или ЛКМ выстрел · <b>M</b> звук · <b>R</b> заново
</p>
<script type="module" src="./src/main.js?v=1"></script>
</body>
</html>
